<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="SelectBox & DropList: a framework-agnostic select box and drop-down list, with live examples." />
    <title>SelectBox docs</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='4' width='20' height='16' rx='4' fill='%235b5bd6'/%3E%3Cpath d='M8 11l4 4 4-4' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
        // Apply the saved theme before first paint
        try {
            const theme = localStorage.getItem('docs-theme');
            if (theme === 'light' || theme === 'dark')
                document.documentElement.dataset.theme = theme;
        } catch (ignored) { /* storage unavailable */ }
    </script>
</head>
<body>
    <header class="app-bar">
        <button class="icon-button nav-toggle" type="button" aria-label="Toggle navigation" aria-controls="nav" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" /></svg>
        </button>
        <a class="brand" href="#">
            <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="4" /><path d="M8 11l4 4 4-4" /></svg>
            <span>SelectBox</span>
        </a>
        <span class="version-chip" id="version"></span>
        <span class="app-bar-spacer"></span>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Toggle dark mode">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
        </button>
        <a class="icon-button" id="repo-link" aria-label="Source on GitHub" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.9a3.4 3.4 0 0 0-.9-2.6c3-.3 6.1-1.5 6.1-6.6a5.2 5.2 0 0 0-1.4-3.6 4.8 4.8 0 0 0-.1-3.6s-1.2-.3-3.8 1.4a13 13 0 0 0-6.8 0C5.5 1.4 4.3 1.7 4.3 1.7a4.8 4.8 0 0 0-.1 3.6 5.2 5.2 0 0 0-1.4 3.6c0 5.1 3.1 6.3 6.1 6.6a3.4 3.4 0 0 0-.9 2.6V22" /></svg>
        </a>
    </header>

    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="nav-scrim" hidden></div>

    <main class="content" id="content">
        <section class="hero">
            <h1>SelectBox</h1>
            <p class="lead">
                A full-featured select box and drop-down list for the web. Single or multiple selection,
                live search, groups, nested menus, custom rendering and virtualized lists of millions of items.
                No framework required, with first-class Vue bindings.
            </p>
        </section>
    </main>

    <script type="module" src="./main.js"></script>
</body>
</html>
